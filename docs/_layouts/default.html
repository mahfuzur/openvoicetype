<!doctype html>
<html lang="en" data-baseurl="{{ site.baseurl }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- assign page_title = page.title | default: site.title -%}
  <title>{% if page.url == "/" %}{{ site.title }}: open-source dictation for macOS{% else %}{{ page_title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#12121C">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/images/app-icon.png' | relative_url }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ '/images/app-icon.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <!-- The saved theme is applied before the page paints, so it never flashes the other one. -->
  <script>try{var t=localStorage.getItem("ovt-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}is-home{% else %}is-doc{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
