{%- assign here = page.url -%}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/app-icon.png' | relative_url }}" width="28" height="28" alt="">
      <span>OpenVoiceType</span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="{{ '/GUIDE.html' | relative_url }}"{% if here == '/GUIDE.html' %} aria-current="page"{% endif %}>Guide</a>
      <a href="{{ '/diagrams/' | relative_url }}"{% if here contains '/diagrams/' %} aria-current="page"{% endif %}>How it works</a>
      <a href="{{ '/#privacy' | relative_url }}">Privacy</a>
      <a href="{{ '/TERMS.html' | relative_url }}"{% if here == '/TERMS.html' %} aria-current="page"{% endif %}>Claude's terms</a>
      <a href="{{ '/ROADMAP.html' | relative_url }}"{% if here == '/ROADMAP.html' %} aria-current="page"{% endif %}>Roadmap</a>
    </nav>
    <div class="actions">
      <button class="icon-button theme-toggle" type="button" aria-label="Switch between light and dark" title="Light or dark">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8Z"/></svg>
      </button>
      <a class="icon-button" href="{{ site.repo_url }}" aria-label="OpenVoiceType on GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true" class="icon-fill"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <a class="button button-small" href="{{ site.repo_url }}/releases/latest">Download</a>
      <details class="menu">
        <summary class="icon-button" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </summary>
        <nav class="menu-panel" aria-label="Main">
          {%- for group in site.data.nav -%}
          <p class="menu-heading">{{ group.title }}</p>
          {%- for item in group.items -%}
          <a href="{% if item.external %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}">{{ item.title }}</a>
          {%- endfor -%}
          {%- endfor -%}
        </nav>
      </details>
    </div>
  </div>
</header>
