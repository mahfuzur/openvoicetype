# OpenVoiceType for Linux (see docs/plans/M7-linux.md). The pipeline is the shared scripts/dictate.sh; these crates are
# the app around it.
[workspace]
resolver = "2"
members = ["crates/ovt-core"]

[workspace.package]
version = "0.5.0" # the release script sets the tag
edition = "2021"
license = "MIT"
repository = "https://github.com/mahfuzur/openvoicetype"

[workspace.dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
