name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          brew install shellcheck
          shellcheck scripts/*.sh

      - name: Check the eval runner and cases
        run: |
          python3 -m py_compile evals/run.py
          python3 -c "import json; json.load(open('evals/cases.json'))"

      # The bundled whisper.cpp and llama.cpp builds take a few minutes; they only change with build-deps.sh.
      - name: Cache the bundled helpers
        uses: actions/cache@v4
        with:
          path: app/build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build the app
        run: |
          command -v cmake || brew install cmake
          ./scripts/build-app.sh
          otool -L app/build/VoiceToText.app/Contents/Helpers/* | grep -v -E '^\S|/usr/lib/|/System/' && exit 1 || true

      - name: Render overlay snapshots
        run: |
          app/build/VoiceToText.app/Contents/MacOS/VoiceToText --overlay-snapshots "$RUNNER_TEMP/snapshots" &
          sleep 20; ls "$RUNNER_TEMP/snapshots"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-app
          path: app/build/VoiceToText.app
