name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          brew install shellcheck
          shellcheck scripts/*.sh

      - name: Check the eval runner and cases
        run: |
          python3 -m py_compile evals/run.py
          python3 -c "import json; json.load(open('evals/cases.json'))"

      - name: Test the dictate.sh contract
        run: scripts/test-dictate.sh

      # The bundled whisper.cpp and llama.cpp builds take a few minutes; they only change with build-deps.sh.
      - name: Cache the bundled helpers
        uses: actions/cache@v4
        with:
          path: app/build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build the app
        run: |
          command -v cmake || brew install cmake
          ./scripts/build-app.sh
          otool -L app/build/VoiceToText.app/Contents/Helpers/* | grep -v -E '^\S|/usr/lib/|/System/' && exit 1 || true

      - name: Render overlay snapshots
        run: |
          app/build/VoiceToText.app/Contents/MacOS/VoiceToText --overlay-snapshots "$RUNNER_TEMP/snapshots" &
          sleep 20; ls "$RUNNER_TEMP/snapshots"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenVoiceType-app
          path: app/build/VoiceToText.app

  # Apple's on-device engines (docs/plans/M5.6-apple-on-device.md): ovt-apple needs the macOS 26 SDK, and the app must
  # build with the newer Swift too. The job above keeps checking the older toolchain (no ovt-apple).
  apple-engines:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: swift --version && xcrun --show-sdk-version

      - name: Build ovt-apple
        run: |
          swift build -c release --package-path app/AppleHelper
          "$(swift build -c release --package-path app/AppleHelper --show-bin-path)/ovt-apple" status || true

      - name: Build the app with the new toolchain (no bundled whisper/llama, to keep it quick)
        run: |
          BUNDLE_DEPS=off ./scripts/build-app.sh
          test -x app/build/VoiceToText.app/Contents/Helpers/ovt-apple

  # The Linux app (docs/plans/M7-linux.md): the same dictate.sh contract, and the Rust crates.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Test the dictate.sh contract
        run: scripts/test-dictate.sh

      - name: Check and test the Rust crates
        working-directory: linux
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
