# OpenVoiceType's Rust code: the logic shared by the Linux and Windows apps (crates/), and each app (linux/crates/,
# windows/crates/; docs/plans/M7-linux.md and M8-windows.md). The macOS app is Swift (app/).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0" # the release script sets the tag
edition = "2021"
license = "MIT"
repository = "https://github.com/mahfuzur/openvoicetype"

[workspace.dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
